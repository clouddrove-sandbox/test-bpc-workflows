# Terraform for the prod root (bpc_prod subscription).
#
# Push to any branch: plan and policy checks; shown in the run summary and on the
# branch's open pull request. No apply.
# Pull request opened to main: the same plan, posted as a comment for the reviewer.
# Push to main: plan, then apply after approval in the `prod` GitHub Environment.
# Manual run: plan; apply only from main with `apply` ticked.
#
# Apply DEV first, verify, then approve PROD (docs/05-operations.md, section 2).
# Setup: _infra/azure/terraform/bootstrap/README.md, "GitHub Actions pipeline".
name: Terraform prod

on:
  push:
    branches: ["**"]
    paths:
      - _infra/azure/terraform/environments/prod/**
      - _infra/azure/terraform/_modules/**
      - _infra/azure/policy/terraform/**
      - .github/workflows/terraform-prod.yml
      - .github/workflows/reusable-terraform-root.yml
      - .github/actions/setup-conftest/**
  # Later pushes to the branch update the comment through the push run.
  pull_request:
    branches: [main, master]
    types: [opened, reopened, ready_for_review]
    paths:
      - _infra/azure/terraform/environments/prod/**
      - _infra/azure/terraform/_modules/**
      - _infra/azure/policy/terraform/**
      - .github/workflows/terraform-prod.yml
      - .github/workflows/reusable-terraform-root.yml
      - .github/actions/setup-conftest/**
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        description: Apply after approval (default branch only).
        default: false

# Branches and pull requests: the newest commit wins. Default branch: runs
# queue, never cancelled mid-apply.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions: {}

jobs:
  prod:
    name: prod
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/reusable-terraform-root.yml
    with:
      root: prod
      apply: ${{ github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || inputs.apply) }}
